# tag v<版本>（和 iOS TestFlight 同一個 tag）：建 APK → 建立 draft prerelease 並附上 APK。
# 擁有者核對後再手動公開，並更新 web/download/index.html（見 docs/release/android-release.md）。
# 簽章必須固定：沒有 ANDROID_KEYSTORE_BASE64 等 secret 就直接失敗，不用 runner 的臨時 debug key。
name: Android APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::缺少 ANDROID_KEYSTORE_BASE64，見 docs/release/android-release.md"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omi.keystore"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/omi.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --dart-define-from-file=config/supabase.dev.json
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/omi-android.apk
          (cd dist && sha256sum omi-android.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          rm -f "$ANDROID_KEYSTORE_PATH"

      # 已有同名 release 就只補附件（不 --clobber，避免覆寫已公開的 APK）
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/omi-android.apk dist/SHA256SUMS.txt
          else
            gh release create "$TAG" dist/omi-android.apk dist/SHA256SUMS.txt \
              --draft --prerelease --title "Omi $TAG" \
              --notes "CI 建置的 Android APK（雲端開發設定）。核對後再公開並更新下載頁。"
          fi
